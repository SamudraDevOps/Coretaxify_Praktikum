server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Aggressively cache static assets like JS, CSS, and images.
    # Their filenames have hashes, so they are unique after each build.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public";
    }

    # Handle the main application routing.
    location / {
        try_files $uri $uri/ /index.html;

        # Specifically set no-cache headers for the main index.html file.
        # This forces Cloudflare and browsers to always get the latest version.
        if ($uri = '/index.html') {
            add_header Cache-Control 'no-cache, no-store, must-revalidate';
            add_header Pragma 'no-cache';
            add_header Expires '0';
        }
    }

    error_page 404 /index.html;

    location ~ /\.ht {
        deny all;
    }
}